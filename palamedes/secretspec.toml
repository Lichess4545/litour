[project]
name = "palamedes"
revision = "1.0"

[profiles.default]
# Fallback profile: secretspec uses this whenever nothing selects another
# profile (no --profile, no SECRETSPEC_PROFILE, no devenv.yaml profile).
BETTER_AUTH_SECRET = { description = "Better Auth cookie/session signing secret", required = true }
LICHESS_API_TOKEN = { description = "Personal lichess token for server-side jobs (optional)", required = false }

[profiles.development]
# devenv.yaml's secretspec block sets `profile: development` — this is the
# profile palamedes' devenv shell actually resolves against.
BETTER_AUTH_SECRET = { description = "Better Auth cookie/session signing secret", required = true }
LICHESS_API_TOKEN = { description = "Personal lichess token for server-side jobs (optional)", required = false }
